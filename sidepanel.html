<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>英語読み上げ</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 12px; line-height: 1.7; }
    .controls { display: flex; gap: 8px; }
    button { font-size: 14px; padding: 4px 16px; }
    #status { margin: 8px 0; color: #555; white-space: pre-wrap; }
    #status.error { color: #c00; }
    #output p { margin: 0 0 12px; }
    .speaking { background: #fff3a0; }
  </style>
</head>
<body>
  <div class="controls">
    <button id="start">開始</button>
    <button id="stop" disabled>停止</button>
  </div>
  <div id="status">ページ上で英文を選択して「開始」を押してください。</div>
  <div id="output"></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
