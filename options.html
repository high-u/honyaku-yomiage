<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>英語読み上げ 設定</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; min-width: 360px; }
    label { display: block; margin-bottom: 12px; }
    input { display: block; width: 100%; box-sizing: border-box; font-size: 14px; padding: 4px; margin-top: 4px; }
    button { font-size: 14px; padding: 4px 16px; }
    #status { margin-top: 8px; color: #555; white-space: pre-wrap; }
    #status.error { color: #c00; }
  </style>
</head>
<body>
  <label>
    翻訳サーバー（llama.cpp の llama-server）
    <input id="llamaUrl" type="text" spellcheck="false">
  </label>
  <label>
    音声合成サーバー（speech.cpp の speech serve）
    <input id="speechUrl" type="text" spellcheck="false">
  </label>
  <button id="save">保存</button>
  <div id="status"></div>
  <script type="module" src="options.js"></script>
</body>
</html>
